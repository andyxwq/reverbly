<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reverbly phone editor</title>
  <meta name="description" content="Phone editor for slowed, sped-up, and loop-ready audio. Export WAV.">
  <meta name="theme-color" content="#0e0b17">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --ink:#f6f3ff; --muted:#b8b1cb; --surface:#181128; --surface-2:#231a36; --line:#3a2e52; --pink:#ff77c8; --purple:#9f7cff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:#0e0b17; font:16px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; }
    a { color:inherit; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    main { width:min(440px,100%); margin:auto; padding:18px 16px 28px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:760; text-decoration:none; }
    .mark { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; color:#160d26; background:linear-gradient(135deg,var(--pink),var(--purple)); }
    .tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; padding:4px; border-radius:16px; background:var(--surface); margin-bottom:14px; }
    .tabs button, .choice, .bar button, .chip { border:0; color:var(--ink); background:transparent; }
    .tabs button { min-height:44px; border-radius:12px; color:var(--muted); font-weight:700; }
    .tabs button.on { background:linear-gradient(105deg,var(--pink),#bea3ff); color:#1b102a; }
    .drop { display:block; padding:22px 16px; text-align:center; border:1.5px dashed #7860a5; border-radius:18px; background:var(--surface); }
    .drop input { margin-top:12px; width:100%; }
    .wave { display:flex; align-items:flex-end; gap:3px; height:84px; margin-top:12px; padding:10px; border-radius:18px; background:var(--surface); }
    .wave i { flex:1; border-radius:99px; background:linear-gradient(180deg,var(--pink),var(--purple)); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .choice { min-height:56px; padding:10px 12px; text-align:left; border-radius:16px; border:1px solid var(--line); background:var(--surface); }
    .choice.on { border-color:var(--pink); background:var(--surface-2); }
    .choice small, .muted { color:var(--muted); }
    label.slider, label.row { display:block; margin-top:14px; color:var(--muted); font-size:14px; }
    label.slider span { float:right; color:var(--pink); }
    input[type=range] { width:100%; accent-color:var(--pink); }
    .chip { min-height:44px; border-radius:14px; background:var(--surface); }
    select { width:100%; min-height:44px; margin-top:8px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 10px; }
    .check { display:flex; align-items:center; gap:10px; min-height:44px; }
    .bar { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:18px; }
    .bar button { min-height:48px; border-radius:16px; font-weight:750; }
    .play { background:var(--surface-2); color:var(--ink); }
    .go { color:#1b102a; background:linear-gradient(105deg,var(--pink),#bea3ff); }
    .status { min-height:1.4em; text-align:center; color:var(--muted); font-size:14px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="/"><span class="mark">R</span>Reverbly</a>
    <a class="muted" href="/reverbly-prototype.html">Full editor</a>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" id="tabSound" class="on">Sound</button>
    <button type="button" id="tabMix">Version</button>
    <button type="button" id="tabExport">Export</button>
  </div>
  <section id="panelSound">
    <label class="drop"><strong>Drop your audio here</strong><div class="muted" id="fileLabel">No audio yet</div><input id="file" type="file" accept="audio/*"></label>
    <div class="wave" id="wave" aria-hidden="true"></div>
    <p class="muted" id="clipLabel">Clip: full file</p>
    <label class="slider">Start <span id="startValue">0.0s</span><input id="start" type="range" min="0" max="1" step="0.1" value="0" disabled></label>
    <label class="slider">End <span id="endValue">0.0s</span><input id="end" type="range" min="0" max="1" step="0.1" value="1" disabled></label>
    <div class="grid" style="margin-top:12px">
      <button class="chip" type="button" data-trim="first15">First 15s</button>
      <button class="chip" type="button" data-trim="last15">Last 15s</button>
      <button class="chip" type="button" data-trim="first30">First 30s</button>
      <button class="chip" type="button" data-trim="last30">Last 30s</button>
    </div>
  </section>
  <section id="panelMix" hidden>
    <div class="grid" id="presets"></div>
    <label class="slider">Speed <span id="speedValue">0.82×</span><input id="speed" type="range" min="0.6" max="1.4" step="0.01" value="0.82"></label>
    <label class="slider">Reverb <span id="reverbValue">58%</span><input id="reverb" type="range" min="0" max="100" step="1" value="58"></label>
    <label class="slider">Bass <span id="bassValue">2 dB</span><input id="bass" type="range" min="0" max="12" step="1" value="2"></label>
    <label class="check"><input id="keepPitch" type="checkbox"> Keep original pitch</label>
  </section>
  <section id="panelExport" hidden>
    <label class="slider">Fade in <span id="fadeInValue">0.0s</span><input id="fadeIn" type="range" min="0" max="5" step="0.1" value="0"></label>
    <label class="slider">Fade out <span id="fadeOutValue">0.0s</span><input id="fadeOut" type="range" min="0" max="5" step="0.1" value="0"></label>
    <label class="slider">Export length
      <select id="loopSeconds"><option value="0">Full clip</option><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">60 seconds</option></select>
    </label>
    <label class="check"><input id="normalize" type="checkbox" checked> Normalize loudness</label>
    <label class="check"><input id="seamless" type="checkbox"> Seamless loop</label>
    <button class="choice" id="ab" type="button" style="width:100%;margin-top:8px">A/B: your mix</button>
    <p class="muted">File name uses the preset, like song-reverbly-slowed.wav</p>
  </section>
  <div class="bar">
    <button class="play" id="play" type="button">Preview</button>
    <button class="go" id="exportBtn" type="button">Export WAV</button>
  </div>
  <p class="status" id="status">Choose a song you own.</p>
</main>
<script>
const PRESETS = [
  { id:"slowed", label:"Slowed", hint:"0.82× · air", speed:0.82, reverb:58, bass:2 },
  { id:"sped", label:"Sped up", hint:"1.18× · tight", speed:1.18, reverb:6, bass:0 },
  { id:"nightcore", label:"Nightcore", hint:"1.25× · bright", speed:1.25, reverb:10, bass:1 },
  { id:"daycore", label:"Daycore", hint:"0.75× · dream", speed:0.75, reverb:72, bass:3 },
  { id:"vibe", label:"Vibe room", hint:"soft low", speed:0.9, reverb:78, bass:6 },
  { id:"vocal", label:"Vocal", hint:"clearer", speed:1, reverb:24, bass:1 },
  { id:"clean", label:"Clean", hint:"dry", speed:1, reverb:0, bass:0 }
];
const $ = (id) => document.getElementById(id);
let preset = "slowed", duration = 0, dry = false, playing = false, busy = false;
let buffer = null, fileName = "audio", audioCtx = null, source = null;
const presetBox = $("presets");
PRESETS.forEach((item) => {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "choice" + (item.id === "slowed" ? " on" : "");
  button.innerHTML = "<strong>" + item.label + "</strong><br><small>" + item.hint + "</small>";
  button.onclick = () => applyPreset(item);
  presetBox.append(button);
});
function applyPreset(item) {
  preset = item.id; $("speed").value = item.speed; $("reverb").value = item.reverb; $("bass").value = item.bass; dry = false; paint();
}
function paint() {
  $("speedValue").textContent = Number($("speed").value).toFixed(2) + "×";
  $("reverbValue").textContent = $("reverb").value + "%";
  $("bassValue").textContent = $("bass").value + " dB";
  $("fadeInValue").textContent = Number($("fadeIn").value).toFixed(1) + "s";
  $("fadeOutValue").textContent = Number($("fadeOut").value).toFixed(1) + "s";
  $("startValue").textContent = Number($("start").value).toFixed(1) + "s";
  $("endValue").textContent = Number($("end").value).toFixed(1) + "s";
  $("clipLabel").textContent = duration ? "Clip " + Number($("start").value).toFixed(1) + "s – " + Number($("end").value).toFixed(1) + "s" : "Clip: full file";
  $("ab").textContent = dry ? "A/B: original" : "A/B: your mix";
  [...presetBox.children].forEach((button, index) => button.classList.toggle("on", PRESETS[index].id === preset));
}
["speed","reverb","bass"].forEach((id) => $(id).addEventListener("input", () => { preset = "custom"; paint(); }));
["fadeIn","fadeOut","start","end"].forEach((id) => $(id).addEventListener("input", () => { if (id === "start" || id === "end") clampClip(); paint(); }));
function show(tab) {
  $("panelSound").hidden = tab !== "sound";
  $("panelMix").hidden = tab !== "mix";
  $("panelExport").hidden = tab !== "export";
  $("tabSound").classList.toggle("on", tab === "sound");
  $("tabMix").classList.toggle("on", tab === "mix");
  $("tabExport").classList.toggle("on", tab === "export");
}
$("tabSound").onclick = () => show("sound");
$("tabMix").onclick = () => show("mix");
$("tabExport").onclick = () => show("export");
function clampClip() {
  const start = Math.max(0, Math.min(Number($("start").value), Math.max(0, duration - 0.2)));
  const end = Math.max(start + 0.2, Math.min(Number($("end").value), duration || 1));
  $("start").value = start; $("end").value = end;
}
function trim(start, end) { $("start").value = start; $("end").value = end; clampClip(); paint(); }
document.querySelectorAll("[data-trim]").forEach((button) => button.onclick = () => {
  const kind = button.getAttribute("data-trim");
  if (kind === "first15") trim(0, Math.min(15, duration || 15));
  if (kind === "last15") trim(Math.max(0, duration - 15), duration);
  if (kind === "first30") trim(0, Math.min(30, duration || 30));
  if (kind === "last30") trim(Math.max(0, duration - 30), duration);
});
function bars(peaks) {
  $("wave").replaceChildren(...peaks.map((peak) => { const bar = document.createElement("i"); bar.style.height = peak + "%"; return bar; }));
}
bars(Array.from({ length: 42 }, (_, i) => 18 + ((i * 17) % 50)));
$("file").onchange = async () => {
  const file = $("file").files && $("file").files[0];
  if (!file) return;
  $("status").textContent = "Reading audio…";
  stop();
  const ctx = new AudioContext();
  try {
    buffer = await ctx.decodeAudioData(await file.arrayBuffer());
    await ctx.close();
    fileName = file.name; duration = buffer.duration;
    $("fileLabel").textContent = file.name;
    $("start").disabled = false; $("end").disabled = false;
    $("start").max = duration; $("end").max = duration;
    trim(0, duration);
    const data = buffer.getChannelData(0), step = Math.max(1, Math.floor(data.length / 42));
    bars(Array.from({ length: 42 }, (_, bar) => {
      let peak = 0; for (let i = 0; i < step; i += 80) peak = Math.max(peak, Math.abs(data[bar * step + i] || 0));
      return Math.max(8, Math.min(100, Math.round(peak * 180)));
    }));
    show("mix");
    $("status").textContent = "Pick a version, then preview.";
  } catch { $("status").textContent = "That file could not be read. Try MP3 or WAV."; }
};
function sliceBuffer(source, startSec, endSec) {
  const rate = source.sampleRate;
  const start = Math.max(0, Math.min(source.length - 1, Math.floor(startSec * rate)));
  const end = Math.max(start + 1, Math.min(source.length, Math.floor(endSec * rate)));
  const out = new AudioBuffer({ length: end - start, numberOfChannels: 2, sampleRate: rate });
  for (let channel = 0; channel < 2; channel++) out.getChannelData(channel).set(source.getChannelData(Math.min(channel, source.numberOfChannels - 1)).subarray(start, end));
  return out;
}
function stretch(source, speed) {
  const rate = Math.max(0.5, Math.min(1.6, speed));
  const length = Math.max(1, Math.floor(source.length / rate));
  const out = new AudioBuffer({ length, numberOfChannels: 2, sampleRate: source.sampleRate });
  for (let channel = 0; channel < 2; channel++) {
    const src = source.getChannelData(channel), dst = out.getChannelData(channel);
    for (let i = 0; i < length; i++) dst[i] = src[Math.min(src.length - 1, Math.floor(i * rate))] || 0;
  }
  return out;
}
async function renderClip(asDry) {
  const speed = Number($("speed").value), reverb = Number($("reverb").value), bassDb = Number($("bass").value);
  const keep = $("keepPitch").checked;
  const clip = sliceBuffer(buffer, Number($("start").value), Number($("end").value));
  const prepared = !asDry && keep && Math.abs(speed - 1) > 0.01 ? stretch(clip, speed) : clip;
  const rate = asDry || keep ? 1 : speed;
  const wet = asDry ? 0 : Math.max(0, Math.min(1, reverb / 100));
  const tail = wet > 0.02 ? 0.35 + wet * 2 : 0;
  const offline = new OfflineAudioContext(2, Math.max(1, Math.ceil((prepared.duration / rate + tail) * prepared.sampleRate)), prepared.sampleRate);
  const node = offline.createBufferSource();
  node.buffer = prepared; node.playbackRate.value = rate;
  const shelf = offline.createBiquadFilter(); shelf.type = "lowshelf"; shelf.frequency.value = 120; shelf.gain.value = asDry ? 0 : bassDb;
  const dryGain = offline.createGain(); dryGain.gain.value = 1 - wet * 0.4;
  const send = offline.createGain(); send.gain.value = wet;
  const verb = offline.createConvolver();
  const impulse = offline.createBuffer(2, Math.floor(offline.sampleRate * 2.2), offline.sampleRate);
  for (let channel = 0; channel < 2; channel++) { const data = impulse.getChannelData(channel); for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2.8); }
  verb.buffer = impulse;
  const fade = offline.createGain();
  const heard = prepared.duration / rate;
  const fadeIn = Math.min(Number($("fadeIn").value), heard / 2), fadeOut = Math.min(Number($("fadeOut").value), heard / 2);
  fade.gain.setValueAtTime(fadeIn > 0 ? 0 : 1, 0);
  if (fadeIn > 0) fade.gain.linearRampToValueAtTime(1, fadeIn);
  fade.gain.setValueAtTime(1, Math.max(fadeIn, heard - fadeOut));
  if (fadeOut > 0) fade.gain.linearRampToValueAtTime(0, heard);
  node.connect(shelf); shelf.connect(dryGain).connect(fade); shelf.connect(send).connect(verb).connect(fade); fade.connect(offline.destination); node.start(0);
  let rendered = await offline.startRendering();
  const channels = [rendered.getChannelData(0), rendered.getChannelData(1)];
  if ($("seamless").checked && rendered.length > rendered.sampleRate * 0.2) {
    const n = Math.floor(rendered.sampleRate * 0.06);
    channels.forEach((data) => { for (let i = 0; i < n; i++) { const t = i / n; data[i] = data[i] * t + data[data.length - n + i] * (1 - t); } });
  }
  if ($("normalize").checked) {
    let peak = 0; channels.forEach((data) => { for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i])); });
    const gain = peak > 0.001 ? 0.89 / peak : 1;
    channels.forEach((data) => { for (let i = 0; i < data.length; i++) data[i] = Math.tanh(data[i] * gain); });
  }
  const loop = Number($("loopSeconds").value);
  if (loop > 0) {
    const target = Math.floor(loop * rendered.sampleRate);
    const looped = new AudioBuffer({ length: target, numberOfChannels: 2, sampleRate: rendered.sampleRate });
    for (let channel = 0; channel < 2; channel++) { const src = rendered.getChannelData(channel), dst = looped.getChannelData(channel); for (let i = 0; i < target; i++) dst[i] = src[i % src.length]; }
    rendered = looped;
  }
  return rendered;
}
function encodeWav(audio) {
  const length = audio.length * 4, array = new ArrayBuffer(44 + length), view = new DataView(array);
  const write = (offset, text) => { for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i)); };
  write(0, "RIFF"); view.setUint32(4, 36 + length, true); write(8, "WAVEfmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 2, true);
  view.setUint32(24, audio.sampleRate, true); view.setUint32(28, audio.sampleRate * 4, true); view.setUint16(32, 4, true); view.setUint16(34, 16, true); write(36, "data"); view.setUint32(40, length, true);
  let offset = 44; const left = audio.getChannelData(0), right = audio.getChannelData(1);
  for (let i = 0; i < audio.length; i++) for (const sample of [left[i], right[i]]) { const clamped = Math.max(-1, Math.min(1, sample)); view.setInt16(offset, clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff, true); offset += 2; }
  return new Blob([array], { type: "audio/wav" });
}
function stop() { try { source && source.stop(); } catch (e) {} source = null; playing = false; $("play").textContent = "Preview"; }
$("play").onclick = async () => {
  if (playing) return stop();
  if (!buffer) { $("status").textContent = "Choose an audio file first."; show("sound"); return; }
  busy = true; $("status").textContent = "Working…";
  try {
    audioCtx = audioCtx || new AudioContext(); if (audioCtx.state === "suspended") await audioCtx.resume();
    const rendered = await renderClip(dry); source = audioCtx.createBufferSource(); source.buffer = rendered; source.connect(audioCtx.destination);
    source.onended = () => { playing = false; $("play").textContent = "Preview"; }; source.start(); playing = true; $("play").textContent = "Stop";
    $("status").textContent = dry ? "Original clip." : "Playing your mix.";
  } catch (e) { $("status").textContent = "Preview failed. Try a shorter clip."; }
  busy = false;
};
$("ab").onclick = () => { dry = !dry; paint(); };
$("exportBtn").onclick = async () => {
  if (!buffer) { $("status").textContent = "Choose an audio file first."; show("sound"); return; }
  $("status").textContent = "Exporting WAV…";
  try {
    const rendered = await renderClip(false);
    const base = fileName.replace(/\.[^.]+$/, "").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").slice(0, 40) || "audio";
    const filename = base + "-reverbly-" + preset + ".wav";
    const link = document.createElement("a"); link.href = URL.createObjectURL(encodeWav(rendered)); link.download = filename; link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 4000);
    $("status").textContent = "Ready to post. " + filename;
  } catch (e) { $("status").textContent = "Export failed. Try a shorter clip."; }
};
paint();
</script>
</body>
</html>
