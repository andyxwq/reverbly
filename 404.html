<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Page not found — Reverbly</title>
  <script>
    // Cloudflare static hosting may not map / → index.html; recover homepage.
    (function () {
      var path = location.pathname || '/';
      if (path === '/' || path === '') {
        location.replace('/');
        return;
      }
    })();
  </script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0b17;color:#f6f3ff;font:16px/1.5 Inter,system-ui,sans-serif;text-align:center;padding:24px}
    a{color:#cdbbff}h1{font-size:42px;letter-spacing:-1.5px;margin:0 0 10px}
    p{color:#b8b1cb}.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
    .btn{padding:12px 16px;border-radius:11px;background:linear-gradient(105deg,#ff77c8,#bea3ff);color:#1b102a;text-decoration:none;font-weight:750}
    @keyframes rise-in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    h1 { animation:rise-in .55s ease both; }
    p { animation:rise-in .65s ease .08s both; }
    .links { animation:rise-in .7s ease .16s both; }
    @media (hover:hover) and (pointer:fine) { a.btn { transition:transform .18s ease; } a.btn:hover { transform:translateY(-2px); } }
    @media (prefers-reduced-motion:reduce) { h1, p, .links { animation:none; } }
    .links a { color:#cdbbff; text-decoration:none; transition:color .18s ease; }
    .links a:hover { color:#f6f3ff; }
    .links a.btn, .links a.btn:hover { color:#1b102a; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page is not part of Reverbly.</p>
    <div class="links">
      <a class="btn" href="/">Home</a>
      <a href="/reverbly-prototype">Editor</a>
      <a href="/reverbly-dashboard">Account</a>
    </div>
  </div>
